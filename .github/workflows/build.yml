name: Сборка

# Непрерывная сборка: проверка кода и сборка приложения на трёх платформах.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            build-essential \
            file \
            pkg-config

      - name: Установка pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Установка зависимостей фронтенда
        run: pnpm --dir ui install --frozen-lockfile

      - name: Проверка форматирования
        run: cargo fmt --all -- --check

      - name: Статический анализ
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Тесты
        run: cargo test --workspace

      - name: Сборка фронтенда
        run: pnpm --dir ui build

  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Фиксация версии Tauri
        run: cargo update -p tauri --precise 2.12.5
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev patchelf build-essential file pkg-config

      - run: pnpm --dir ui install --frozen-lockfile
      - run: ./ui/node_modules/.bin/tauri build --bundles deb,appimage,rpm
      - uses: actions/upload-artifact@v4
        with:
          name: fontlord-linux
          path: target/release/bundle/**
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Фиксация версии Tauri
        run: cargo update -p tauri --precise 2.12.5
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Установка зависимостей фронтенда
        run: pnpm --dir ui install --frozen-lockfile

      - run: ./ui/node_modules/.bin/tauri build --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: fontlord-macos
          path: target/release/bundle/**
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Фиксация версии Tauri
        run: cargo update -p tauri --precise 2.12.5
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Установка зависимостей фронтенда
        run: pnpm --dir ui install --frozen-lockfile

      - run: ./ui/node_modules/.bin/tauri build --bundles msi,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: fontlord-windows
          path: target/release/bundle/**
          if-no-files-found: error
